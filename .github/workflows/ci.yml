name: ci

# Why this exists: this repo runs production (blog +网盘 + WebDAV) and its 60
# backend tests had never run anywhere but one laptop. The sibling repo learned
# this the hard way — its site generator was broken for a whole milestone because
# nothing built it on push. Same failure mode, higher stakes here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # This repo is public, and the convention is that the server's real IP and ssh
  # username live only in a private local note — the tree writes <user>@<server>.
  # That convention was enforced by hand exactly once (a 2026-06-23 scrub commit);
  # eleven days later a deploy doc put `ssh <user>@<ip>` straight back, and it sat on
  # public main unnoticed. A convention nothing checks is a convention that decays,
  # so it is a check now. See scripts/check-no-server-identity.py for why it
  # resolves the site's own DNS instead of hardcoding what it is looking for.
  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the trailer check below can see the commit range's
      # history; the other guards here only look at the tree and do not need it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no server identity in the tree
        run: python3 scripts/check-no-server-identity.py

      # No Claude attribution in new commits. The rule is suppressed at the Claude
      # Code settings source, but that is per-machine/per-session — a different
      # machine or a session whose system prompt insists will slip it in. This is
      # the backstop that does not depend on who committed: commit-msg catches it
      # locally (an opt-in hook), this catches it authoritatively. 20 such trailers
      # once had to be force-pushed out of history; this exists so that cannot recur.
      - name: no Claude attribution in commit messages
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            range="HEAD~1..HEAD"
          else
            range="${{ github.event.before }}..HEAD"
          fi
          python3 scripts/check-no-claude-trailer.py --range "$range"

      # .gitignore keeps the .env *file* out of the tree; it does not stop a key
      # value being pasted into a tracked source file or doc — a mistake an agent
      # that reads .env for context is prone to. gitleaks scans the tree for that.
      # Pinned binary rather than the action: no org-license prompt, and the
      # ruleset version is pinned like every other tool here. --no-git because this
      # job is checkout-only, so the tree is tracked files only (no .venv/node_modules).
      #
      # The sha256 is the other half of pinning: a version number is a name, and
      # the bytes GitHub hands back under that name can be re-uploaded or served
      # by something that is not GitHub. This runner then executes them. `sha` is
      # the value from the release's own gitleaks_8.18.4_checksums.txt, written
      # down here rather than fetched beside the binary — a checksum from the same
      # place as the file it checks is not a check. Piping curl straight into tar
      # is why it has to land on disk first: there is no verifying a stream that
      # has already been extracted.
      - name: no secret values in tracked files
        run: |
          v=8.18.4
          sha=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1

      # The deploy and rollback scripts are the least-exercised code in the repo:
      # nothing runs them until production is already on fire, which is the worst
      # possible moment to find out `sed -i` ate a symlink. shellcheck is not a
      # test — nothing here boots a server — but it is the only automated opinion
      # they get, and it is the one that caught `rm -rf "$APP/lib"` running as root
      # with no guard on $APP being non-empty.
      # -x so the harnesses' `source .../mutant-shard.sh` is followed rather than
      # skipped; without it the shared sharding helper is unchecked and every
      # variable it defines reads as unassigned.
      #
      # The harness list is a glob, not six names. It used to be a hand-written
      # list and http-timeout-mutants/run.sh — added with the outbound-deadline
      # batch — was simply never added to it, so that harness went unchecked
      # here and unrun in CI at the same time. A list you have to remember to
      # extend is a list that ends up short.
      - name: shellcheck deploy scripts
        run: >-
          shellcheck -x backend-dawn/deploy/*.sh backend-dawn/build.sh
          backend-dawn/scripts/mutant-shard.sh
          backend-dawn/scripts/*/run.sh scripts/fetch-dawn.sh
          deploy/*.sh

  backend:
    runs-on: ubuntu-latest
    # Build, unit tests, goldens and the deployable. The mutation matrices used
    # to live here too and grew until they did not fit: on 2026-08-14 this job
    # was cancelled at its 62-minute ceiling partway through the FM ancestor
    # matrix, having needed about 102. They are their own jobs now (see
    # `mutants` below), which is why this budget could come back down.
    #
    # Measured on that run: 15s of setup, 57s for tests + jar, ~5s for the four
    # goldens, 1s to upload. budget: well over 10x that, and still small enough
    # that a hang is caught in minutes rather than at the end of an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # backend-dawn is written in Dawn, so building it needs the sibling repo's
      # compiler. It used to be checked out and built from main on every run.
      # That was deliberate — "compile against the language as it is today" — but
      # the price was that any commit in dawn-lang could turn this repo red
      # without this repo changing, and nothing recorded which compiler built a
      # given backend. Production runs on this; it had outgrown that trade.
      #
      # build.sh now resolves the toolchain through scripts/fetch-dawn.sh, which
      # reads .dawn-version — the same file this laptop reads. Bumping the
      # compiler is a commit here, reviewable and revertable like any other.
      - name: cache the pinned dawn toolchain
        uses: actions/cache@v4
        with:
          path: .dawn
          key: dawn-${{ hashFiles('.dawn-version') }}

      # dawn.toml's [java-deps] are resolved by coursier, which caches here.
      # Keyed on dawn.toml since that is the single source of truth for versions.
      - name: cache java-deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('backend-dawn/dawn.toml') }}
          restore-keys: coursier-

      # build.sh = fetch the pinned dawn, then `dawn test .` and `dawn build .`.
      # The tests are hermetic (no .env, no DB, no libsimple, no live host);
      # `dawn build` fetches java-deps into backend-dawn/lib/ next to the jar,
      # which is what the jar's relative manifest Class-Path points at.
      - name: backend tests + jar
        run: ./backend-dawn/build.sh

      - name: Java FFI boundaries
        run: python3 backend-dawn/scripts/check-ffi-boundaries.py

      # The contract scripts (read / edge / WebDAV) were written during M6 to
      # diff Dawn against FastAPI request by request. That needed both backends
      # up at once, so CI never ran them. The current four goldens hold 292 wire
      # shapes, all exercised against a freshly seeded fixture on every run.
      # They are golden-based now: contract_run.py seeds a pinned SQLite fixture
      # (contract_fixture.py), boots the jar this job just built on 127.0.0.1,
      # and compares every response with backend-dawn/scripts/golden/*.json.
      #
      # The fourth script (qiniu) boots a second backend pointed at a fake
      # object store on loopback (contract_qiniu_fake.py), which is how the
      # paths that reach a bucket — subtree COPY, PUT->GET, overwrite, register
      # — are held to a golden without a credential anywhere near CI. Bucket
      # usage stats stay a named skip; skips are listed in the goldens and
      # printed by every run, so "CI ran it" cannot quietly become "CI compared
      # nothing". Re-record with `contract_run.py --record` and review the diff.
      - name: contract goldens (read / edge / webdav / qiniu)
        run: python3 backend-dawn/scripts/contract_run.py

      # The deployable artifact. The jar is deliberately NOT in git: a build
      # output committed by hand drifts from src/ silently, and its lib/ is
      # gitignored anyway, so the in-repo jar could never run from a checkout.
      # What gets deployed is now what CI built and tested, from a known commit.
      # jar + lib/ travel together — the jar's manifest Class-Path is relative.
      #
      # This step no longer sits downstream of the mutation matrices — they are
      # separate jobs now, so the artifact appears while they are still running.
      # That does not loosen the deploy gate: deploy.sh resolves the run through
      # `?status=success`, which is the whole workflow's conclusion, so a red
      # shard or an incomplete `mutants-complete` still leaves nothing for it to
      # deploy. The artifact existing and the artifact being deployable are two
      # different questions, and only the second one is deploy.sh's.
      - name: upload deployable
        uses: actions/upload-artifact@v4
        with:
          name: backend-dawn-${{ github.sha }}
          path: |
            backend-dawn/backend-dawn.jar
            backend-dawn/lib/
          if-no-files-found: error
          retention-days: 30

  # Every mutation harness, one job per shard. These are the gates that prove
  # the other gates can fail: each mutant is a one-line production change that
  # must turn exactly one named assertion red.
  #
  # Why they are sharded rather than steps in `backend`: measured on 2026-08-14,
  # a mutant costs ~52s (5.9s `dawn build` at 236% CPU, 38.4s `dawn test` at
  # 41%) and there are 150 of them, so serial they are ~2 hours and they blew
  # the job's ceiling. Each mutant is an independent copy of the project on its
  # own port, so they parallelise with no interference; and since the dominant
  # `dawn test` barely uses a core, splitting them across runners buys nearly
  # the full factor rather than fighting for CPU.
  #
  # Shard counts are sized from that 52s, targeting ~10 minutes of mutants per
  # job on top of ~2-3 minutes of per-shard fixed cost (checkout, toolchain,
  # each harness's own base build and preflight, which every shard repeats
  # because they are what makes its slice trustworthy). Total here is 17 jobs;
  # with the four above that is 21, one past the concurrent-job ceiling for this
  # account. Adding a shard past that does not fail, it queues — but it also
  # stops buying wall clock, so re-measure before growing this list.
  #
  # updated-at-boundary-mutants is deliberately unsharded: its 13 mutants
  # measured 10m24s locally on 2026-08-14 (11 measured 8m47s the same day,
  # before #267 added two), under the ~12 minutes the largest fm-ancestor shard
  # is projected to take, so it does not extend the critical path. Splitting it
  # would add a job that queues behind the ceiling and halve ten minutes that
  # nobody is waiting on. Growing it further does eventually cross that line —
  # re-measure before adding more.
  #
  # fail-fast is off on purpose: one red harness should not cancel the others,
  # or a run tells you about the first failure only and hides the rest.
  mutants:
    runs-on: ubuntu-latest
    # Projected, not yet measured: the largest shard is 10 fm-ancestor mutants
    # at the 52s each observed on 2026-08-14, plus ~3 minutes of fixed setup and
    # base checks, so ~12 minutes. budget: 3x that. Re-measure from a real run
    # and correct this rather than leaving an estimate standing as a fact.
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        include:
          - {harness: db-connection-boundary-mutants, shard: 0, shards: 1}
          - {harness: http-body-boundary-mutants, shard: 0, shards: 1}
          - {harness: http-timeout-mutants, shard: 0, shards: 1}
          - {harness: response-stream-boundary-mutants, shard: 0, shards: 1}
          - {harness: updated-at-boundary-mutants, shard: 0, shards: 1}
          - {harness: webdav-destination-mutants, shard: 0, shards: 3}
          - {harness: webdav-destination-mutants, shard: 1, shards: 3}
          - {harness: webdav-destination-mutants, shard: 2, shards: 3}
          - {harness: fm-ancestor-contract, shard: 0, shards: 9}
          - {harness: fm-ancestor-contract, shard: 1, shards: 9}
          - {harness: fm-ancestor-contract, shard: 2, shards: 9}
          - {harness: fm-ancestor-contract, shard: 3, shards: 9}
          - {harness: fm-ancestor-contract, shard: 4, shards: 9}
          - {harness: fm-ancestor-contract, shard: 5, shards: 9}
          - {harness: fm-ancestor-contract, shard: 6, shards: 9}
          - {harness: fm-ancestor-contract, shard: 7, shards: 9}
          - {harness: fm-ancestor-contract, shard: 8, shards: 9}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cache the pinned dawn toolchain
        uses: actions/cache@v4
        with:
          path: .dawn
          key: dawn-${{ hashFiles('.dawn-version') }}

      - name: cache java-deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('backend-dawn/dawn.toml') }}
          restore-keys: coursier-

      # MUTANT_COVERAGE_OUT is what makes the shard accountable: it records the
      # mutants this run actually executed, and the `mutants-complete` job below
      # refuses to pass unless the shards together cover the whole matrix.
      - name: ${{ matrix.harness }} shard ${{ matrix.shard }}/${{ matrix.shards }}
        env:
          MUTANT_COVERAGE_OUT: >-
            ${{ github.workspace }}/coverage/${{ matrix.harness }}-${{ matrix.shard }}.coverage
        run: >-
          backend-dawn/scripts/${{ matrix.harness }}/run.sh
          --shard ${{ matrix.shard }}/${{ matrix.shards }}

      - name: upload this shard's coverage
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-${{ matrix.harness }}-${{ matrix.shard }}
          path: coverage/
          if-no-files-found: error
          retention-days: 1

  # The shards cannot vouch for themselves: one that skipped its whole slice
  # prints the same PASS lines and exits 0 as one that did the work. This job
  # collects what every shard wrote down and holds the union to each harness's
  # matrix.txt, so a dropped shard, a miscounted `--shard I/N`, or a matrix row
  # nobody picked up is a named failure rather than a quietly smaller gate.
  #
  # `if: always()` so it still reports when a shard failed: a red mutant and a
  # missing mutant are different news and both are worth having.
  mutants-complete:
    runs-on: ubuntu-latest
    needs: mutants
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Before trusting the checker's verdict, make it fail on the seven shapes
      # it exists to catch. A coverage checker that returns "all good" for every
      # input is the same green as a real one, and it is the last thing standing
      # between a dropped shard and a silently smaller gate.
      - name: the coverage checker still catches gaps
        run: python3 backend-dawn/scripts/mutants_coverage.py --self-test

      - name: collect every shard's coverage
        uses: actions/download-artifact@v4
        with:
          pattern: mutant-coverage-*
          path: coverage

      - name: the shards together cover every mutant
        run: >-
          python3 backend-dawn/scripts/mutants_coverage.py
          --coverage-dir coverage

  # The FastAPI backend is retired from serving (M6 moved every route to Dawn on
  # :8001) but it is not dead code: it is the emergency rollback target —
  # deploy/rollback-to-fastapi.sh points nginx back at uvicorn :8000, against the
  # same DB. A rollback target nothing exercises is not a rollback target, it is
  # a guess. It also remains the reference implementation the contract_*.py
  # scripts diff the Dawn backend against.
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.10, not latest: production is Ubuntu 22.04, whose python3 is 3.10, and
      # the code is held to that baseline. Testing on newer tests what does not ship.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: install
        run: pip install -r requirements-dev.txt
        working-directory: backend

      # From the repo root: pyproject.toml covers backend/, backend-dawn/scripts/
      # and deploy/, not just the one package.
      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      # The simple-tokenizer test (2-char CJK + pinyin — the reason the extension
      # was chosen at all) skips everywhere else: the .so is deliberately not in
      # git, and neither the dev laptop nor the server can reach GitHub releases.
      # A runner can, so this is the one place that assertion ever runs.
      #
      # Deliberately NOT continue-on-error: the test skips itself when the .so is
      # absent, so tolerating a failed fetch would silently restore the very state
      # this job exists to end — green CI that never ran the assertion. Failing
      # here is also real news: this same script is how the server gets the .so.
      - name: fetch the simple fts extension
        run: python scripts/fetch_simple_ext.py
        working-directory: backend

      # -rs so a skip is visible in the log rather than a silent dot.
      #
      # Coverage reports, deliberately without a threshold. A number to defend
      # invites tests written to move the number; what is wanted here is only
      # visibility into which modules nothing touches. Not in pytest.ini either,
      # so a local `pytest` stays fast.
      - name: tests
        run: pytest -rs --cov=app --cov-report=term-missing:skip-covered
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Before npm ci, deliberately: the file-manager name rules live in
      # frontend/src/utils/fmPath.js, which imports nothing, and the checker
      # imports nothing either, so this needs no node_modules and fails in about
      # a second. The rules it holds are all subtractions — "does not trim", "does
      # not send a request" — which no lint, build or type check can see: putting
      # a .trim() back is valid code that silently rewrites what the user typed.
      # Each of the five rules names, in a comment beside it, the one-line
      # production mutant that turns it and only it red; the matrix was measured,
      # not assumed. Runs in ~0.3s locally; 2 minutes is a hang, not a slow run.
      - name: file-manager name rules
        run: node scripts/check-fm-path.mjs
        timeout-minutes: 2

      # npm ci, not install: it fails loudly when the lockfile and package.json
      # disagree, which is the whole point of having the lockfile committed.
      - name: install
        run: npm ci
        working-directory: frontend

      - name: lint
        run: npm run lint
        working-directory: frontend

      - name: formatting
        run: npm run format:check
        working-directory: frontend

      - name: build
        run: npm run build
        working-directory: frontend
